name: offline-unit-tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Offline tests (not Isaac Gym experiments)
        run: PYTHONPATH=src python -m pytest -q tests/
